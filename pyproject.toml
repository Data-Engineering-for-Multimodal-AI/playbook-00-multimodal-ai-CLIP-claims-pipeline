[project]
name = "playbook-00-multimodal-ai-clip-claims-pipeline"
version = "2026.10"
description = "Multimodal pet-insurance claim search with CLIP and Weaviate (companion to Data Engineering for Multimodal AI)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "weaviate-client>=4.24,<5",
    "torch>=2.6",
    "transformers>=5.0",
    "pillow>=11",
    "numpy>=2.0",
    "pandas>=2.2",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "python-multipart>=0.0.20",
    "requests>=2.32",
    "streamlit>=1.50",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
