name: smoke

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # weekly, Monday 06:00 UTC, so breakage in upstream packages shows up

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Cache the CLIP model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: clip-vit-base-patch32
      - name: Start Weaviate
        run: docker compose up -d --wait weaviate
      - name: Smoke test
        run: make smoke
      - name: One-command run
        run: make run
      # README "Run it", steps 2 to 4, as written
      - name: Run it, steps 2 to 4
        run: |
          make run | tee /tmp/run.txt
          grep -q "5 claims in Weaviate" /tmp/run.txt
          grep -q "1. CLM002 Jack (French Bulldog, Willow Veterinary Center)" /tmp/run.txt
          make search DESCRIBE="a curly-haired dog" | tee /tmp/search.txt
          grep -q "1. CLM001 Emma (Goldendoodle" /tmp/search.txt
          make search TEXT="limping after a fall" | tee /tmp/search2.txt
          grep -q "Searching with text" /tmp/search2.txt
          make evaluate | tee /tmp/eval.txt
          grep -qE "^breed -> photo \(text to image\) +5 +1.00 +1.00$" /tmp/eval.txt
      - name: Use your own data
        run: |
          uv run --frozen pytest -q tests/test_own_data.py
          make check-data DIR=data | tee /tmp/check.txt
          grep -q "data: 5 claims OK" /tmp/check.txt
          make load DIR=data | tee /tmp/load.txt
          grep -q "5 claims in Weaviate. Search them with make search" /tmp/load.txt
      - name: Try this 1 to 3
        run: |
          make try-prompts | tee /tmp/try1.txt
          grep -qE "^\{breed\} +5 of 5" /tmp/try1.txt
          make try-xray-words | tee /tmp/try2.txt
          grep -qE "^breed -> pet photo +5 of 5" /tmp/try2.txt
          make try-crowding | tee /tmp/try3.txt
          grep -qE "^  X-ray +0.9[0-9]{2}$" /tmp/try3.txt
      - name: Printed install path (pip install -r requirements.txt, then the README's commands)
        run: |
          uv venv --seed --python ${{ matrix.python-version }} /tmp/pipenv
          /tmp/pipenv/bin/python -m pip install -q -r requirements.txt
          PYTHON=/tmp/pipenv/bin/python ./run_pipeline.sh --no-ui
          /tmp/pipenv/bin/python test_claims_search.py --text "dental"
          /tmp/pipenv/bin/python test_claims_search.py --photo data/PetPhotos/rocky_victor-g-N04FIfHhv_k-unsplash.jpg
          /tmp/pipenv/bin/python test_claims_search.py --xray data/PetXrays/emma_1.2.410.200028.100.3.20190924.1430080534.21770.1.1.png
          /tmp/pipenv/bin/python run_tests.py
      - name: Stop services
        if: always()
        run: docker compose down -v

  devcontainer:
    # Builds .devcontainer/ the way Codespaces does and runs the playbook inside it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the devcontainer and run the playbook
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: start=$(date +%s) && make run && echo "Time to first output in a clean devcontainer was $(( $(date +%s) - start )) s"
