name: smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Cache the CLIP model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: clip-vit-base-patch32
      - name: Start Weaviate
        run: docker compose up -d --wait weaviate
      - name: Tests
        run: make smoke
      - name: pip install -r requirements.txt, then the README's commands
        run: |
          uv venv --seed --python ${{ matrix.python-version }} /tmp/pipenv
          /tmp/pipenv/bin/python -m pip install -q -r requirements.txt
          PYTHON=/tmp/pipenv/bin/python ./run_pipeline.sh --no-ui
          /tmp/pipenv/bin/python test_claims_search.py --text "dental"
          /tmp/pipenv/bin/python search_similar_claims.py --describe "a curly-haired dog"
          /tmp/pipenv/bin/python run_tests.py
